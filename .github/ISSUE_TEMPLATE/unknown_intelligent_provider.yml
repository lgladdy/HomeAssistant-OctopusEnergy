name: Unknown intelligent provider
description: You have been notified of an unknown intelligent provider within HA and want to help resolve the issue.
labels: ["enhancement"]
assignees:
  - BottlecapDave
body:
  - type: input
    id: provider
    attributes:
      label: Provider name
      description: Please provide the name of the provider as presented in the raised repair notice
    validations:
      required: true
  - type: textarea
    id: bump_charge
    attributes:
      label: Ability to bump charge within the app
      description: Please provide a screenshot of the feature within the app or type "Not available"
    validations:
      required: true
  - type: textarea
    id: target_charge
    attributes:
      label: Ability to set the charge limit/target within the app
      description: Please provide a screenshot of the feature within the app or type "Not available"
    validations:
      required: true
  - type: textarea
    id: target_time
    attributes:
      label: Ability to set the time the charge will be at its target for within the app
      description: Please provide a screenshot of the feature within the app or type "Not available"
    validations:
      required: true
  - type: textarea
    id: smart_charge
    attributes:
      label: Ability to turn smart charge on/off within the app
      description: Please provide a screenshot of the feature within the app or type "Not available"
    validations:
      required: true
  - type: textarea
    id: planned_dispatches
    attributes:
      label: Ability to see planned dispatches within the app
      description: Please provide a screenshot of the feature within the app or type "Not available"
    validations:
      required: true
  - type: checkboxes
    id: ai-triage-consent
    attributes:
      label: AI Triage
      description: >-
        This repository uses an AI assistant to help triage new issues (for example, suggesting relevant GraphQL
        API endpoints that could implement the feature). This is optional - if you don't consent, your issue is
        your issue is still triaged by the maintainer as normal, just without the automated help.
      options:
        - label: I consent to this issue, including any text I provide, being processed by an AI assistant for automated triage
